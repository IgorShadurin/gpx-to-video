[package]
name = "gpx-to-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local bicycle telemetry overlays from GPX and CSV, rendered in Rust"
repository = "https://github.com/IgorShadurin/gpx-to-video"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
fontdue = "0.9"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
tiny_http = "0.12"
toml = "0.9"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
